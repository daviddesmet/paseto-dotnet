name: Release Drafter

on:
  push:
    branches:
      - master
    paths:
     - 'src/**'

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write # Required to create/update release drafts
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
