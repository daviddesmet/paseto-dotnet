name: CodeQL

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 5 * * 1' # Weekly, Mondays 05:30 UTC

permissions:
  contents: read

env:
  # Enforce locked-mode NuGet restore (RestoreLockedMode in the csproj files keys off this)
  ContinuousIntegrationBuild: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Install .NET SDK'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          queries: security-and-quality
      - name: 'Build'
        run: dotnet build src/Paseto/Paseto.csproj --configuration Release
      - name: 'Perform CodeQL Analysis'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:csharp'
